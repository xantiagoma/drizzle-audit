name: Publish

# Publishes to npm when a version tag is pushed (`bun run release`, which runs
# `changelogen --release --push`; see "Releasing" in CLAUDE.md).
#
# Auth is npm trusted publishing (OIDC): no NPM_TOKEN secret. The trust is configured on npmjs.com
# for this repo and this workflow file
# (`npm trust github drizzle-audit --repo xantiagoma/drizzle-audit --file publish.yml`), and needs
# npm >= 11.5.1 (Node 24 ships it).
#
# Re-publish an existing tag (e.g. after a failed publish): run this workflow manually with `tag`
# set: `gh workflow run publish.yml -f tag=v0.1.13`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.13)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing + provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install
      - run: bun run build

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        run: gh release create "$TAG" --verify-tag --generate-notes || echo "Release already exists"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
